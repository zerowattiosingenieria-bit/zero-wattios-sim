<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Zero Wattios Niveles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,800;1,900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sala de control a pantalla completa — mapa isométrico de la Comunidad de Madrid a la izquierda, panel de operaciones a la derecha, KPIs arriba. Look único claro (corporativo Zero Wattios: lima + grafito sobre blanco). */
:root{
  --bg:#ECEEE8; --panel:#FFFFFF; --ink:#242422; --muted:#6C7066; --line:#E1E4DB; --soft:#F5F6F1;
  --lime:#B4FA1E; --lime-d:#9BDB10; --lime-soft:#EEFCCB; --lime-ink:#3D5700;
  --char:#242422; --char2:#3B3B38;
  --ok:#178A50; --ok-soft:#E1F3E8; --warn:#C96A12; --warn-soft:#FCEEDB; --bad:#C73636; --bad-soft:#FAE4E4; --blue:#2F55B8; --blue-soft:#E8EEFB;
  --f-display:'Montserrat',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--char);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}

.top{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--panel);border-bottom:3px solid var(--lime);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:30px;width:auto;display:block}
.brand .tag{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:12px;letter-spacing:.04em;background:var(--char);color:var(--lime);padding:3px 8px;border-radius:5px;white-space:nowrap}
.kpis{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.kpi{padding:5px 11px;border:1px solid var(--line);border-radius:10px;background:var(--soft);flex:1 1 0;min-width:96px}
.kpi.goal{background:var(--char);border-color:var(--char);color:#fff;flex-grow:2}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
.kpi.goal .l{color:#B9BCB3}
.kpi .v{font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:11px;color:var(--muted);font-weight:500}
.kpi.goal .v small{color:#B9BCB3}
.kpi .v.neg{color:var(--bad)}
.kpi .bar{height:5px;border-radius:3px;background:#4A4A46;margin-top:4px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--lime)}
.clock{display:flex;align-items:center;gap:10px}
.date{font-family:var(--f-mono);font-size:13px;font-weight:600;text-align:right;white-space:nowrap}
.date small{display:block;color:var(--muted);font-family:var(--f-body);font-weight:400;font-size:11px}
.speed{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.speed button{border:0;background:var(--panel);padding:7px 9px;font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--muted)}
.speed button+button{border-left:1px solid var(--line)}
.speed button.on{background:var(--char);color:var(--lime)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
#map.hover{cursor:pointer}
.mapctl{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 4px 14px rgba(36,36,34,.08)}
.mapctl button{border:0;background:none;width:34px;height:34px;font-size:17px;font-weight:600}
.mapctl button+button{border-top:1px solid var(--line)}
.legend{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:4px;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block;flex-shrink:0}
.weather{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--char);color:var(--lime);font-weight:600;font-size:12px;padding:5px 12px;border-radius:999px;white-space:nowrap;max-width:calc(100% - 120px);overflow:hidden;text-overflow:ellipsis}

.tracker{position:absolute;left:12px;bottom:12px;right:12px;max-width:660px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px 12px;box-shadow:0 6px 18px rgba(36,36,34,.08)}
.tracker .hd{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-bottom:8px}
.tracker .hd b{color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:13px}
.steps{display:grid;grid-template-columns:repeat(8,1fr);position:relative}
.steps::before{content:"";position:absolute;left:6%;right:6%;top:11px;height:2px;background:var(--line)}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);position:relative;text-align:center}
.step i{width:22px;height:22px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
.step.done i{background:var(--char);border-color:var(--char);color:var(--lime)}
.step.cur i{border-color:var(--char);background:var(--lime);box-shadow:0 0 0 4px var(--lime-soft)}
.step.cur{color:var(--ink);font-weight:600}

.toasts{position:absolute;right:12px;top:232px;display:grid;gap:8px;width:min(310px,calc(100% - 80px));pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--char);border-radius:10px;padding:8px 12px;font-size:12.5px;box-shadow:0 6px 18px rgba(36,36,34,.12);animation:tin .25s ease-out}
.toast b{display:block;font-size:13px;margin-bottom:1px}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)} .toast.bad{border-left-color:var(--bad)} .toast.lime{border-left-color:var(--lime)}
@keyframes tin{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}

.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(236,238,232,.6);padding:16px;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;max-width:500px;box-shadow:0 18px 50px rgba(36,36,34,.2)}
.card .bee{width:54px;height:54px;display:block;margin-bottom:10px}
.card h2{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:24px;margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
.card p{color:var(--muted);margin:0 0 12px;line-height:1.5}
.card ul{margin:0 0 16px;padding-left:18px;line-height:1.55;font-size:13.5px}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goals button{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;text-align:left}
.goals button:hover{border-color:var(--char);background:var(--lime-soft)}
.goals b{display:block;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:18px}
.goals span{font-size:12px;color:var(--muted)}
.card .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}
.card .stats div{background:var(--soft);border-radius:10px;padding:8px 10px}
.card .stats span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card .stats b{font-family:var(--f-mono);font-size:16px}

.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.detail{padding:14px 16px 16px;border-bottom:1px solid var(--line);overflow:auto;max-height:60%;flex-shrink:0}
.detail .empty{color:var(--muted);line-height:1.5}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dh h3{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0;text-wrap:balance}
.dh .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--blue-soft);color:var(--blue)}
.pill.act{background:var(--lime);color:var(--char)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.grey{background:var(--soft);color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.facts div{background:var(--soft);border-radius:9px;padding:7px 9px;min-width:0}
.facts span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.facts b{font-family:var(--f-mono);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.note{font-size:13px;line-height:1.5;background:var(--soft);border-radius:9px;padding:9px 11px;margin:10px 0}
.note.act{background:var(--lime-soft)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px}
.btn:hover{border-color:#BCC0B5}
.btn.pri{background:var(--lime);border-color:var(--lime-d);color:var(--char)}
.btn.pri:hover{background:var(--lime-d)}
.btn.dark{background:var(--char);border-color:var(--char);color:#fff}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:12px}
.opts{display:grid;gap:6px;margin:10px 0}
.opt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 11px}
.opt b{font-size:13px}
.opt span{grid-column:1;font-size:12px;color:var(--muted)}
.opt em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-family:var(--f-mono);font-weight:600}
.opt.on{border-color:var(--char);background:var(--lime-soft)}
.mg{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px}
.mg b{color:var(--ink);font-family:var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--char)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:8px 0;font-size:12.5px}
.calc span{color:var(--muted)}
.calc b{font-family:var(--f-mono);text-align:right}
.prob{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prob i{display:block;height:100%;border-radius:4px}
.part{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:8px}
.part .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:13px}
.progress{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:7px}
.progress i{display:block;height:100%;background:var(--lime-d)}

.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px;flex-shrink:0;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 8px 9px;font-weight:600;font-size:12.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--lime)}
.tabs .n{display:inline-block;min-width:17px;padding:0 5px;border-radius:9px;background:var(--lime);color:var(--char);font-size:10.5px;margin-left:4px;font-family:var(--f-mono)}
.tabbody{flex:1;overflow:auto;padding:4px 16px 18px;min-height:0}
.grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:14px 0 4px;display:flex;justify-content:space-between;gap:8px}
.row{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 2px;text-align:left}
.row:hover{background:var(--soft)}
.row.sel{background:var(--lime-soft)}
.row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:12px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item .t{min-width:0;flex:1}
.item .t b{display:block;font-size:13px}
.item .t small{color:var(--muted);font-size:12px;display:block;line-height:1.4}
.stars{color:var(--char);letter-spacing:1px;font-size:12px}
.stars i{color:#CDD1C6;font-style:normal}
.qty{font-family:var(--f-mono);font-weight:600;font-size:15px;min-width:40px;text-align:right}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 9px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--char);color:var(--lime)}
.sw{width:38px;height:22px;border-radius:11px;border:0;background:#D3D7CC;position:relative;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--char)}
.sw.on::after{left:19px;background:var(--lime)}
.log{font-size:12.5px;line-height:1.45;padding:7px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:52px 1fr;gap:8px}
.log span{font-family:var(--f-mono);color:var(--muted);font-size:11.5px}
.muted{color:var(--muted)}
.srcbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:6px 0}
.srcbar i{display:block;height:100%}

.task{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-top:8px;background:var(--panel)}
.task.sel{border-color:var(--char);background:var(--lime-soft)}
.task .ti{width:36px;height:36px;border-radius:10px;border:0;background:var(--lime);color:var(--char);display:grid;place-items:center;grid-row:span 2}
.task .tt{border:0;background:none;text-align:left;padding:0;min-width:0}
.task .tt b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .tt small{color:var(--muted);font-size:12px}
.task .ta{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.btn.wide{width:100%;margin-top:6px;padding:10px}
.apause{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.apause.on{background:var(--lime);border-color:var(--lime-d);color:var(--char)}
.spark{display:block;width:100%;height:18px;margin-top:3px}
.goalsbox{position:absolute;top:12px;left:12px;width:min(270px,calc(100% - 80px));background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 6px 18px rgba(36,36,34,.08);display:grid;gap:7px}
.goalsbox .gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goalsbox .gh b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:13.5px}
.goalsbox .gh span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;white-space:nowrap}
.goalsbox .gt{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.goalsbox .gt em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.goalsbox .gb{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}
.goalsbox .gb i{display:block;height:100%;background:var(--char)}
.goalsbox .gl.ok .gb i{background:var(--lime-d)}
.goalsbox .gl.ok .gt span{color:var(--ok);font-weight:600}
.goalsbox .gf{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.banner{position:absolute;left:50%;top:44px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:var(--char);color:#fff;border-radius:14px;padding:12px 18px;box-shadow:0 14px 40px rgba(0,0,0,.3);animation:bin .5s cubic-bezier(.2,1.4,.4,1);max-width:calc(100% - 32px);z-index:5}
.banner img{width:44px;height:44px}
.banner b{display:block;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:18px;color:var(--lime)}
.banner span{font-size:13px;color:#DADDD4}
@keyframes bin{from{transform:translate(-50%,-20px) scale(.9);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.typelegend{position:absolute;top:124px;right:12px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:6px;font-size:11.5px;color:var(--muted)}
.typelegend span{display:flex;align-items:center;gap:8px}
.typelegend i{display:inline-block;width:14px;height:12px;border:1px solid #B5B9AE;border-radius:2px}
.tracker{background:var(--char);color:#fff;border:0;border-radius:16px;padding:12px 26px 14px;max-width:720px;box-shadow:0 12px 30px rgba(36,36,34,.28)}
.trk-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.trk-who small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--lime);font-weight:600}
.trk-who b{display:block;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:16px;line-height:1.2}
.trk-who span{font-size:12px;color:#B9BCB3}
.trk-step{text-align:right;flex-shrink:0}
.trk-step em{display:block;font-style:normal;font-family:var(--f-display);font-weight:900;font-style:italic;font-size:24px;color:var(--lime);line-height:1}
.trk-step span{font-size:11.5px;color:#DADDD4}
.road{position:relative;height:74px;margin:0 6px}
.asphalt{position:absolute;left:-14px;right:-14px;top:30px;height:16px;border-radius:8px;background:#3E3E3A;overflow:hidden;background-image:repeating-linear-gradient(90deg,transparent 0 10px,rgba(255,255,255,.35) 10px 20px);background-size:100% 2px;background-repeat:no-repeat;background-position:0 7px}
.asphalt .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(180,250,30,.25),rgba(180,250,30,.55));transition:width .6s ease;margin-left:14px}
.ms{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:30px;width:70px}
.ms i{width:28px;height:28px;border-radius:50%;background:#3E3E3A;color:#9A9D93;display:grid;place-items:center;border:2px solid #55554F;position:relative;z-index:1}
.ms span{font-size:10.5px;color:#9A9D93;white-space:nowrap;margin-top:-10px}
.ms.done i{background:var(--lime);border-color:var(--lime);color:var(--char)}
.ms.done span{color:#DADDD4}
.ms.cur i{background:#fff;border-color:var(--lime);color:var(--char);box-shadow:0 0 0 5px rgba(180,250,30,.25);animation:pulse 1.6s ease-in-out infinite}
.ms.cur span{color:var(--lime);font-weight:700}
.van{position:absolute;top:24px;transform:translateX(-50%);transition:left .6s ease;z-index:2;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.van.moving svg{animation:bump .45s ease-in-out infinite}
@keyframes bump{50%{transform:translateY(-1.5px)}}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(180,250,30,.08)}}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;display:block}
  .main{grid-template-columns:1fr}
  .mapwrap{height:58vh;min-height:380px}
  .side{border-left:0;border-top:1px solid var(--line)}
  .detail{max-height:none}
  .tabbody{overflow:visible}

function makeLead(src,townName,forceType,quality){
  const mix=src==='capt'?{vivienda:.7,comunidad:.25,empresa:.05}:src==='feria'?{empresa:.7,comunidad:.3}:src==='refer'?{vivienda:.7,comunidad:.15,empresa:.15}:CHANNELS[src]?CHANNELS[src].mix:{vivienda:.6,empresa:.2,comunidad:.2};
  const type=forceType||wpick(mix);
  let cands=T_TOWNS.filter(t=>t.slots.some(s=>!s.job&&!s.inst&&s.type===slotType(type)));
  if(townName) cands=cands.filter(t=>t.name===townName||t.i===townName);
  if(!cands.length) return null;
  const w=cands.map(t=>(t.i===S.ev.promoTown&&S.day<S.ev.promoUntil&&(src==='capt'||src==='buzon')?4:1)*(t.type==='city'?1.3:1));
  let r=Math.random()*w.reduce((x,y)=>x+y,0),t=cands[0];for(let i=0;i<cands.length;i++){r-=w[i];if(r<=0){t=cands[i];break;}}
  const slot=pick(t.slots.filter(s=>!s.job&&!s.inst&&s.type===slotType(type)));
  const q=clamp(0.05-0.025*D_()+(quality!==undefined?quality:src==='refer'?0.86:src==='feria'?0.74:src==='ini'?0.7:CHANNELS[src]?CHANNELS[src].q:0.6)+rand(-0.1,0.1),0.2,0.95);
  const j={id:uid++,src,town:t.i,slot:slot.id,type,stage:'lead',t:Math.max(8,(type==='comunidad'?20:15)-0.6*D_()),opt:0,margin:S.office.autoMargin,price:0,paid:0,costs:0,born:S.day,interest:q,parts:{}};
  if(type==='empresa'){j.name=pick(EMPRESAS)+' '+pick(EMP2);j.consumo=randi(28,160)*1000;j.roof=randi(25,120)*10;}
  else if(type==='comunidad'){j.name='CP '+pick(CALLES)+' '+randi(2,60);j.viv=randi(12,48);j.consumo=j.viv*randi(25,40)*100;j.roof=randi(18,60)*10;j.gas=Math.random()<0.75;j.emisor='radiadores';}
  else {j.name=person();j.m2=randi(9,48)*10;j.pers=randi(2,7);j.emisor=Math.random()<0.4?'suelo':'radiadores';j.consumo=Math.round((2500+j.m2*12+j.pers*350)/100)*100;j.roof=Math.round(clamp(j.m2*0.45,30,140));j.gas=Math.random()<0.55;}
  j.cfg=type==='empresa'?null:aeroCfg(j);
  j.opts=buildOpts(j);
  slot.job=j.id;S.jobs.push(j);
  S.stats.src[src]=(S.stats.src[src]||0)+1;
  return j;
}
function slotType(type){return type==='empresa'?'nave':type==='comunidad'?'bloque':'casa';}
function mods(kwp){return Math.max(4,Math.ceil(kwp/0.45));}
function opt(label,m,inv,bat,aero,am){return{label,mod:m,kwp:m*0.45,inv,bat,aero,am:am||0};}
function buildOpts(j){
  if(j.type==='empresa'){const m=mods(Math.min(j.consumo/1450*0.8,j.roof/5.5)),inv=Math.ceil(m*0.45/20);
    return[opt('Fotovoltaica',m,inv,0,0),opt('Fotovoltaica + baterías',m,inv,Math.max(2,Math.ceil(m*0.45/15)),0)];}
  const am=j.cfg.am;
  if(j.type==='comunidad'){const m=mods(Math.min(j.consumo/1450*0.7,j.roof/6)),inv=Math.ceil(m*0.45/20),ae=Math.max(2,Math.ceil(j.viv/12));
    return[opt('FV autoconsumo colectivo',m,inv,0,0),opt('Aerotermia central',0,0,0,ae,am),opt('Aerotermia central + FV',m,inv,0,ae,am)];}
  const m=mods(Math.min(j.consumo/1450*0.9,j.roof/5));
  return[opt('Fotovoltaica',m,1,0,0),opt('FV + batería',m,1,m*0.45>6?2:1,0),opt('Aerotermia',0,0,0,1,am),opt('Aerotermia + FV',m+3,1,0,1,am)];
}
function aeroDesc(j,o){const c=j.cfg;return o.aero+(o.aero>1?' × ':' ')+'Domusa '+AERO[o.am].kw+' kW · ACS '+c.acs+' L · inercia '+c.inercia+' L';}
function basePrice(k){return (1+0.02*D_())*(k==='mod'?ITEM.mod.cost*(S.day<S.ev.modUntil?1.15:1):ITEM[k].cost);}
function matBase(o){return o.mod*basePrice('mod')+o.inv*basePrice('inv')+o.bat*basePrice('bat')+(o.aero?o.aero*basePrice('a'+AERO[o.am].kw):0);}
function fvRef(o){return o.kwp?o.mod*basePrice('mod')+o.inv*basePrice('inv')+o.bat*basePrice('bat')+o.kwp*380+900:0;}
function fvPrice(o,m){return o.kwp?Math.round(fvRef(o)*(1+m)/10)*10:0;}
function aePrice(o){return o.aero?o.aero*AERO[o.am].price:0;}
function price(o,m,d){return fvPrice(o,m)+aePrice(o)-(d?COST.discount:0);}
function subCostFv(o){return Math.round(o.kwp*COST.subFvKwp+COST.subFix);}
function subCostAe(o){return o.aero*COST.subAe+COST.subFix;}
function comOf(j){return S.com.find(c=>c.id===j.com);}
function prob(j,o,m,d){
  const fp=fvPrice(o,m),ap=aePrice(o);
  const pfv=clamp(1-(m-0.2)*(1.4+0.1*D_()),0.12,1), pae=0.92-0.02*D_(); // la aerotermia va a precio de tarifa
  const pf=(fp*pfv+ap*pae)/(fp+ap);
  let fit=1;
  if(o.aero&&o.kwp) fit=j.gas?1.15:0.7; else if(o.aero) fit=j.gas?1.05:0.45; else if(o.bat) fit=j.type==='empresa'?0.85:0.95; else if(j.gas&&j.type!=='empresa') fit=0.9;
  if(o.aero&&S.day<S.ev.subvUntil) fit*=1.15;
  const c=comOf(j); const sk=c?0.72+0.1*c.skill:0.9; const team=c&&c.rank==='jr'&&c.boss?1.08:1; const dir=S.office.dirCom?1.1:1;
  const disc=d?1+COST.discount/(fp+ap)*2.5:1; // 1.000 € pesan más en una operación pequeña
  return clamp(j.interest*pf*fit*sk*team*dir*disc,0.03,0.9);
}
function montDays(o,part){return part==='fv'?Math.max(1,Math.ceil(o.kwp/7))+(o.bat?0.5:0):Math.max(1,o.aero*1.2);}

/* ================= decisiones ================= */
const job=id=>S.jobs.find(j=>j.id===id);
const slotOf=j=>allSlots[j.slot];
const freeCom=()=>S.com.filter(c=>!c.job).sort((a,b)=>b.skill-a.skill)[0];
function quick(j,a){
  if(a==='auto')a=j.stage==='lead'?'qvisit':j.stage==='propuesta'?'qsend':j.stage==='material'?'qnave':j.stage==='obra'?'qcrew':'';
  if(a==='qvisit'){if(freeCom())sendVisit(j);}
  else if(a==='qsend'){applyRec(j);sendProposal(j);}
  else if(a==='qnave'){const sh=shortage([j]);if(Object.values(sh).some(v=>v))orderMissing([j]);else buyDist(j);}
  else if(a==='qdist')buyDist(j);
  else if(a==='qcrew')autoCrew(j);
  renderAll();
}
function sendVisit(j,c){
  c=c||freeCom(); if(!c) return toast('Sin comerciales libres','Contrata a otro o espera a que vuelva uno.','warn');
  c.job=j.id;j.com=c.id;j.stage='visita';j.t=Infinity;
  addVan('com',j,null,c);log(c.name+' va a visitar a '+j.name+' ('+towns[j.town].name+').');renderAll();
}
function sendProposal(j){
  const o=j.opts[j.opt];j.price=price(o,j.margin,j.disc);j.p=prob(j,o,j.margin,j.disc);
  j.stage='enviada';j.t=rand(1,3);log('Propuesta a '+j.name+': '+o.label+' por '+fmt(j.price)+(j.disc?' (con 1.000 € de descuento)':'')+' ('+Math.round(j.p*100)+' %).');renderAll();
}
// comisiones de una operación firmada
function commissions(j,d){
  const out=[];const c=comOf(j),half=d?0.5:1;
  if(j.src==='capt'&&j.captId){const cp=S.capt.find(x=>x.id===j.captId);out.push(['Captador'+(cp?' ('+cp.name.split(' ')[0]+')':''),COST.captCom,cp]);}
  if(c){out.push([(c.rank==='sr'?'Comercial senior':'Comercial junior')+' ('+c.name.split(' ')[0]+')',(c.rank==='sr'?COST.srCom:COST.jrCom)*half,c]);
    if(c.rank==='jr'&&c.boss){const b=S.com.find(x=>x.id===c.boss);if(b)out.push(['Senior de equipo ('+b.name.split(' ')[0]+')',COST.srOverride*half,b]);}}
  if(S.office.admin==='own')out.push(['Contable',COST.contableCom,null]);
  return out;
}
function sign(j,silent){
  const o=j.opts[j.opt]; if(!j.price)j.price=price(o,j.margin,j.disc);
  S.stats.sales+=j.price;j.paid=Math.round(j.price*0.3);S.cash+=j.paid;
  const cm=commissions(j,j.disc);const tot=cm.reduce((a,x)=>a+x[1],0);S.cash-=tot;j.costs+=tot;j.comm=tot;S.stats.signed++;if(j.type==='empresa')S.stats.emp++;if(j.type==='comunidad')S.stats.com++;
  cm.forEach(x=>{if(x[2])x[2].ops=(x[2].ops||0)+1;});
  const c=comOf(j);if(c)c.sales+=j.price;
  j.parts={};if(o.kwp)j.parts.fv={st:'pend'};if(o.aero)j.parts.ae={st:'pend'};
  if(!silent)addFx(j,'Firmado '+fk(j.price),'#B4FA1E');
  if(!silent){log('Firma '+j.name+': '+fmt(j.price)+'. Anticipo 30 %. Comisiones '+fmt(tot)+'.');toast('¡Firmado! '+j.name,fmt(j.price)+' · anticipo cobrado','ok');}
  supply(j);
}
function need(o){const n={mod:o.mod,inv:o.inv,bat:o.bat};if(o.aero)n['a'+AERO[o.am].kw]=o.aero;return n;}
function supply(j){
  // Por defecto: lo que haya en la nave sale de la nave; lo que falte se pide al distribuidor.
  const o=j.opts[j.opt],n=need(o);let nave=0,dist=0;const miss=[];
  for(const k in n){const take=S.nave?Math.min(S.stock[k],n[k]):0;S.stock[k]-=take;nave+=take*basePrice(k)*BUY.nave;const r=n[k]-take;if(r>0){dist+=r*basePrice(k)*BUY.dist;miss.push(r+' × '+ITEM[k].name);}}
  j.costs+=nave;
  if(dist===0){j.stage='obra';j.matFrom='nave';log('Material de '+j.name+' sacado de la nave.');if(S.office.dirOps)autoCrew(j);return;}
  S.cash-=dist;j.costs+=dist;j.stage='material';j.matFrom=nave?'mixto':'dist';j.t=Infinity;
  const s=slotOf(j);S.trucks.push({from:DIST_DOCK,tx:s.x+0.5,ty:s.y+0.4,p:0,travel:0.4+Math.hypot(s.x-DIST_DOCK.x,s.y-DIST_DOCK.y)/30,job:j.id,kind:'site'});
  log(nave?'Material de '+j.name+': parte de la nave y al distribuidor '+miss.join(', ')+' ('+fmt(dist)+').':'Material de '+j.name+' pedido al distribuidor ('+fmt(dist)+'), entrega directa en obra.');
}
function buyDist(j){
  const o=j.opts[j.opt],c=matBase(o)*BUY.dist;S.cash-=c;j.costs+=c;j.stage='material';j.matFrom='dist';j.t=Infinity;
  const s=slotOf(j);S.trucks.push({from:DIST_DOCK,tx:s.x+0.5,ty:s.y+0.4,p:0,travel:0.4+Math.hypot(s.x-DIST_DOCK.x,s.y-DIST_DOCK.y)/30,job:j.id,kind:'site'});
  log('Material de '+j.name+' pedido al distribuidor ('+fmt(c)+'), entrega directa en obra.');
}
function assignPart(j,part,own){
  const o=j.opts[j.opt],P_=j.parts[part];if(!P_||P_.st!=='pend')return;
  if(own){const team=S[part].find(t=>!t.job);if(!team)return toast('Sin equipo libre','Subcontrata o espera.','warn');team.job=j.id;P_.crew=team.name;P_.own=true;addVan(part,j,part,team);}
  else{const c=part==='fv'?subCostFv(o):subCostAe(o);S.cash-=c;j.costs+=c;P_.crew=part==='fv'?'Subcontrata FV':'Subcontrata clima';P_.own=false;addVan(part==='fv'?'subfv':'subae',j,part,null);}
  P_.st='route';P_.dur=montDays(o,part);renderAll();
}
function autoCrew(j){for(const part of ['fv','ae']){const P_=j.parts[part];if(P_&&P_.st==='pend')assignPart(j,part,!!S[part].find(t=>!t.job));}}
function order(k,q,silent){
  const c=basePrice(k)*BUY.nave*q;S.cash-=c;
  S.trucks.push({from:DIST_DOCK,tx:DOCK.x-0.2,ty:DOCK.y+0.6,p:0,travel:ITEM[k].lead,kind:'nave',k,q});
  if(!silent)log('Pedido a la nave: '+q+' × '+ITEM[k].name+' ('+fmt(c)+').');renderAll();
}
function pendingFor(k){return S.trucks.filter(t=>t.kind==='nave'&&t.k===k).reduce((a,t)=>a+t.q,0);}
function shortage(list){const tot=emptyStock();list.forEach(j=>{const n=need(j.opts[j.opt]);for(const k in tot)tot[k]+=n[k];});const out={};for(const k in tot)out[k]=Math.max(0,tot[k]-S.stock[k]-pendingFor(k));return out;}
function orderMissing(list){const sh=shortage(list);let any=false;for(const k in sh)if(sh[k]>0){order(k,sh[k],true);any=true;}
  if(any){log('Pedido a la nave de lo que falta para '+list.length+' obra(s).');toast('Material pedido','Llega a la nave en 3-5 días.','');}else toast('Nada que pedir','Ya está pedido o en la nave.','');renderAll();}
function hire(kind,id){
  if(kind==='capt'||kind==='com'){const i=S.cand[kind].findIndex(c=>c.id===id);if(i<0)return;const c=S.cand[kind].splice(i,1)[0];S[kind].push(c);if(kind==='com')assignBoss(c);S.cash-=500;log('Contratas a '+c.name+' como '+(kind==='capt'?'captador/a':c.rank==='sr'?'comercial senior':'comercial junior')+' ('+c.skill+'★, '+fmt(c.salary)+'/mes).');if(kind==='com'&&c.rank==='sr')S.com.filter(x=>x.rank==='jr'&&!x.boss).forEach(assignBoss);}
  else{const L=S[kind];L.push({id:kind+(L.length+1)+'_'+uid++,name:(kind==='fv'?'Equipo FV ':'Equipo aerotermia ')+(L.length+1),job:null});S.cash-=1800;log('Contratas un '+(kind==='fv'?'equipo de fotovoltaica':'equipo de aerotermia')+' propio (2 técnicos + furgoneta).');}
  renderAll();
}
function fire(kind,id){
  const L=S[kind],i=L.findIndex(x=>x.id===id);if(i<0)return;const x=L[i];if(x.job)return toast('Está trabajando','Espera a que termine la obra.','warn');if(x.me)return;
  L.splice(i,1);S.cash-=1000;log('Baja de '+x.name+' (indemnización 1.000 €).');
  if(kind==='com')S.com.filter(c=>c.boss===x.id).forEach(assignBoss);renderAll();
}
function promote(id){const c=S.com.find(x=>x.id===id);if(!c||c.rank==='sr')return;c.rank='sr';c.salary=COST.sr;c.boss=null;log(c.name+' asciende a comercial senior ('+fmt(COST.sr)+'/mes).');S.com.filter(x=>x.rank==='jr').forEach(assignBoss);renderAll();}
function feria(){if(S.day<S.feriaReady)return;S.cash-=FERIA.cost;S.feriaReady=S.day+FERIA.cool;let n=0;for(let i=0;i<randi(4,6);i++)if(makeLead('feria'))n++;log('Feria de energía en IFEMA: '+n+' leads de calidad.');toast('Feria en IFEMA',n+' leads nuevos, sobre todo empresas.','lime');renderAll();}

/* ================= vehículos ================= */
function addVan(kind,j,part,staff){const s=slotOf(j);S.vans.push({kind,job:j.id,part,staff,tx:s.x+(part==='ae'?0.55:0.45),ty:s.y+(part==='ae'?-0.1:0.3),p:0,travel:0.15+Math.hypot(s.x-DOCK.x,s.y-DOCK.y)/30,phase:'go'});}
function updVans(dd){
  for(const v of S.vans){
    const j=job(v.job);
    if(v.phase==='go'){v.p+=dd/v.travel;if(v.p>=1){v.p=1;v.phase='stay';
      if(v.kind==='com'){j.t=1;}else{const P_=j.parts[v.part];P_.st='work';P_.t=P_.dur;}renderAll();}}
    else if(v.phase==='stay'){const stay=v.kind==='com'?(j&&j.stage==='visita'):(j&&j.parts[v.part]&&j.parts[v.part].st==='work');if(!stay)v.phase='back';}
    else{v.p-=dd/v.travel;if(v.p<=0){v.done=true;if(v.staff)v.staff.job=null;renderAll();}}
  }
  S.vans=S.vans.filter(v=>!v.done);
  for(const t of S.trucks){
    if(t.back){t.p-=dd/0.6;if(t.p<=0)t.done=true;continue;}
    t.p+=dd/t.travel;if(t.p>=1){t.p=1;t.back=true;
      if(t.kind==='nave'){S.stock[t.k]+=t.q;log('Llega a la nave: '+t.q+' × '+ITEM[t.k].name+'.');S.jobs.filter(x=>x.stage==='material'&&!x.matFrom).sort((a,b)=>a.id-b.id).forEach(supply);}
      else{const j=job(t.job);if(j&&j.stage==='material'){j.stage='obra';toast('Material en obra · '+j.name,S.office.dirOps?'Rubén (operaciones) asigna equipos.':'Asigna los equipos de montaje.','lime');if(S.office.dirOps)autoCrew(j);}}
      renderAll();}
  }
  S.trucks=S.trucks.filter(t=>!t.done);
}

/* ================= ciclo diario ================= */
function lose(j,why){j.stage='perdida';j.why=why;S.stats.lost++;slotOf(j).job=null;slotOf(j).work=null;log(j.name+': '+why);}
function legalTime(){const base=S.office.legal==='own'?randi(2,4):randi(4,7);return base+(S.day<S.ev.legalUntil?3:0);}
function legalLoad(){return S.jobs.filter(j=>j.stage==='legal'&&j.t!==Infinity).length;}
function tickJobs(dd){
  const rain=S.day<S.ev.rainUntil;
  for(const j of S.jobs){
    switch(j.stage){
      case 'lead': j.t-=dd;if(j.t<=0){lose(j,'Se enfrió sin visita.');toast('Lead perdido',j.name+' no recibió visita.','bad');renderAll();}
        else if(S.office.dirCom&&freeCom()) sendVisit(j); break;
      case 'visita': if(j.t!==Infinity){j.t-=dd;if(j.t<=0){const c=comOf(j);if(c)c.visits++;
          const fail=0.15+0.012*D_()-0.03*(c?c.skill:3);
          if(Math.random()<fail){lose(j,'La visita no salió bien: el cliente no ve claro el ahorro.');toast('Visita fallida',(c?c.name:'')+' no convence a '+j.name+'.','bad');}
          else{j.stage='propuesta';j.t=j.type==='comunidad'?15:12;toast('Propuesta pendiente',j.name+' espera presupuesto.','lime');
            if(S.office.dirCom){j.opt=bestOpt(j);j.margin=S.office.autoMargin;sendProposal(j);}}
          renderAll();}} break;
      case 'propuesta': j.t-=dd;if(j.t<=0){lose(j,'No recibió la propuesta a tiempo.');toast('Cliente perdido',j.name+' se cansó de esperar.','bad');renderAll();} break;
      case 'enviada': j.t-=dd;if(j.t<=0){
          if(j.type==='comunidad'&&!j.juntaDone){j.stage='junta';j.t=randi(4,8);log(j.name+' lo lleva a junta de propietarios.');renderAll();break;}
          resolve(j);} break;
      case 'junta': j.t-=dd;if(j.t<=0){j.juntaDone=true;resolve(j);} break;
      case 'obra':{
        let all=true;
        for(const k in j.parts){const P_=j.parts[k];
          if(P_.st==='work'&&!rain){P_.t-=dd;if(P_.t<=0){P_.st='done';toast((k==='fv'?'Placas montadas':'Aerotermia instalada')+' · '+j.name,towns[j.town].name,'ok');renderAll();}}
          if(P_.st!=='done')all=false;}
        if(all){const o=j.opts[j.opt];S.stats.kwp+=o.kwp;S.stats.aero+=o.aero;const cons=o.kwp*COST.consumKwp;S.cash-=cons;j.costs+=cons;
          slotOf(j).inst={mods:o.mod,aero:o.aero};slotOf(j).work=null;addFx(j,o.kwp?'+'+k1(o.kwp)+' kWp':'Aerotermia lista','#FFFFFF');
          j.stage='legal';j.t=Infinity;log('Obra terminada en '+towns[j.town].name+': '+(o.kwp?k1(o.kwp)+' kWp':'')+(o.aero?(o.kwp?' + ':'')+o.aero+' bomba(s) de calor':'')+'.');renderAll();}
        break;}
      case 'legal':
        if(j.t===Infinity){const cap=S.office.legal==='own'?6:99;if(legalLoad()<cap){j.t=legalTime();if(S.office.legal==='ext'){S.cash-=COST.legalExt;j.costs+=COST.legalExt;}}}
        else{j.t-=dd;if(j.t<=0){S.cash-=300;j.costs+=300;j.stage='cobro';j.t=S.office.admin==='own'?randi(1,3):randi(2,6);log('Legalizada: '+j.name+'.');renderAll();}} break;
      case 'cobro': j.t-=dd;if(j.t<=0){const rest=j.price-j.paid;S.cash+=rest;j.paid=j.price;j.stage='cerrada';addFx(j,'+'+fk(rest),'#7CE08A');S.stats.closed++;S.stats.profit+=j.price-j.costs;log('Cobrado '+fmt(rest)+' de '+j.name+'. Margen de obra '+fmt(j.price-j.costs)+'.');toast('Cobrado · '+j.name,'+'+fmt(rest),'ok');
          if(Math.random()<0.25){const r=makeLead('refer');if(r)toast('Recomendación',j.name+' os recomienda a '+r.name+'.','lime');}renderAll();} break;
    }
  }
}
function resolve(j){
  if(Math.random()<j.p){sign(j);}
  else{lose(j,j.p<0.4?'Rechazada: ve el precio alto.':'Rechazada: firmó con otra instaladora.');toast('Propuesta rechazada',j.name,'bad');}
  renderAll();
}
function estProfit(j,o,m,d){const pr=price(o,m,d),mat=matBase(o)*(S.nave?BUY.nave:BUY.dist),lab=(o.kwp?subCostFv(o):0)+(o.aero?subCostAe(o):0),ct=commissions(j,d).reduce((a,x)=>a+x[1],0);return pr-mat-lab*0.6-o.kwp*COST.consumKwp-(S.office.legal==='ext'?COST.legalExt:0)-300-ct;}
function recommend(j){let best=null;j.opts.forEach((o,i)=>{for(const m of (o.kwp?[0.15,0.2,0.25,0.3,0.35,0.4,0.45]:[0.3]))for(const d of [false,true]){const p=prob(j,o,m,d),ev=p*(estProfit(j,o,m,d)+0.1*price(o,m,d));if(!best||ev>best.ev)best={i,m,d,ev,p,price:price(o,m,d)};}});return best;}
function applyRec(j){const r=recommend(j);j.opt=r.i;j.margin=r.m;j.disc=r.d;}
function bestOpt(j){let b=0,bv=-1;j.opts.forEach((o,i)=>{const v=prob(j,o,S.office.autoMargin)*price(o,S.office.autoMargin);if(v>bv){bv=v;b=i;}});return b;}
function monthly(){
  const o=S.office;let c=COST.office+(S.nave?COST.nave:0);
  c+=S.capt.reduce((a,x)=>a+x.salary,0)+S.com.reduce((a,x)=>a+x.salary,0)+S.fv.length*COST.fv+S.ae.length*COST.ae;
  if(o.dirCom)c+=COST.dirCom;if(o.dirOps)c+=COST.dirOps;c+=o.legal==='own'?COST.legalOwn:0;c+=o.admin==='own'?COST.contable:COST.adminExt;
  for(const k in S.mkt)if(S.mkt[k])c+=CHANNELS[k].cost;
  return c;
}
const EVENTS=[
  {w:3,run(){S.ev.rainUntil=S.day+2;return['Borrasca en Madrid','Los montajes se paran 2 días.','warn'];}},
  {w:2,run(){S.ev.legalUntil=S.day+15;return['Distribuidora eléctrica saturada','Las legalizaciones tardan 6 días más durante 15 días.','warn'];}},

  {w:2,run(){S.ev.subvUntil=S.day+25;return['Nueva línea de ayudas a la aerotermia','Las propuestas con bomba de calor convencen más durante 25 días.','lime'];}},
  {w:1.6,ok:()=>S.jobs.some(j=>j.stage==='cobro'),run(){const j=pick(S.jobs.filter(j=>j.stage==='cobro'));const d=S.office.admin==='own'?5:15;j.t+=d;return['Cliente que paga tarde',j.name+' retrasa el pago '+d+' días'+(S.office.admin==='own'?' (administración lo persigue)':'')+'.','bad'];}},
  {w:1.2,run(){const c=candidate('com');c.skill=5;c.rank='sr';c.salary=COST.sr;c.name=person();S.cand.com.unshift(c);S.cand.com=S.cand.com.slice(0,4);return['Un comercial de la competencia quiere fichar',c.name+' (5★) está en candidatos de Equipo.','lime'];}},
  {w:1.5,run(){makeLead('refer');makeLead('refer');return['Boca a boca','Entran 2 leads por recomendación.','ok'];}}
];
function onNewDay(){
  const d=S.day;S.hist.push({c:S.cash,k:S.stats.kwp,s:S.stats.sales});
  // captación
  S.capt.forEach(c=>{const rate=0.2+0.09*c.skill+(c.town===S.ev.promoTown&&d<S.ev.promoUntil?0.25:0);if(Math.random()<rate){const j=makeLead('capt',c.town,null,0.4+0.08*c.skill);if(j){c.leads++;j.capt=c.name;j.captId=c.id;toast('Lead de '+c.name.split(' ')[0],j.name+' · '+towns[j.town].name,'lime');}}});
  for(const k in S.mkt)if(S.mkt[k]){const ch=CHANNELS[k];let r=ch.rate*1.3;while(r>0){if(Math.random()<Math.min(1,r)){const j=makeLead(k);if(j)toast('Lead de '+ch.name,j.name+' · '+towns[j.town].name,'lime');}r-=1;}}
  // gastos fijos prorrateados
  const daily=monthly()/30;S.cash-=daily;S.costsMonth+=daily;
  if(d%30===0){log('Gastos fijos del mes: '+fmt(S.costsMonth)+'.');S.costsMonth=0;}
  // candidatos y eventos
  if(d>=S.nextCand){S.nextCand=d+15;S.cand.capt=[candidate('capt'),candidate('capt'),candidate('capt')];S.cand.com=[candidate('com'),candidate('com'),candidate('com')];}
  if(d>=S.nextEvent){const pool=EVENTS.filter(e=>!e.ok||e.ok());let r=Math.random()*pool.reduce((a,e)=>a+e.w,0),e=pool[0];for(const x of pool){r-=x.w;if(r<=0){e=x;break;}}
    const[t,m,c]=e.run();toast(t,m,c);log(t+'. '+m);S.nextEvent=d+randi(8,14)-Math.floor(D_()/2);}
  if(S.cash<20000&&!S.warnedNeg){S.warnedNeg=true;toast('Caja casi a cero','Si baja de 0 € pierdes la partida. Frena gastos o cobra obras.','bad');}
  if(S.cash>=30000)S.warnedNeg=false;
  if(S.cash<BANK_LIMIT)return endGame('bank');
  renderAll();
}
function goalVal(g){
  const st=S.stats,b=S.lvBase||st;
  const rel=(k)=>g.rel?st[k]-b[k]:st[k];
  switch(g.k){
    case 'nCom':return S.com.length;case 'nCapt':return S.capt.length;
    case 'dir':return (S.office.dirCom?1:0)+(S.office.dirOps?1:0);
    case 'teams':return S.fv.length+S.ae.length;
    case 'cash':return S.cash;
    default:return rel(g.k);
  }
}
function lvl(){return LEVELS[Math.min(S.level,LEVELS.length)-1];}
function lvProgress(){if(S.level>LEVELS.length)return 1;const L=lvl();return L.goals.reduce((a,g)=>a+clamp(goalVal(g)/g.v,0,1),0)/L.goals.length;}
function goalTxt(g,v){return g.k==='sales'||g.k==='cash'?fk(Math.max(0,v))+' / '+fk(g.v):g.k==='kwp'?k1(Math.max(0,v))+' / '+nf.format(g.v)+' kWp':nf.format(Math.max(0,v))+' / '+nf.format(g.v);}
function checkLevel(){
  if(S.over||S.level>LEVELS.length)return;
  const L=lvl();if(!L.goals.every(g=>goalVal(g)>=g.v))return;
  const used=S.day-S.lvStart,st=used<=L.days?3:used<=L.days*1.5?2:1;
  const bonus=Math.round((10000+S.level*5000)*(st===3?1.5:st===2?1:0.5));
  S.cash+=bonus;S.stars.push(st);
  log('Nivel '+S.level+' ('+L.name+') superado en '+Math.ceil(used)+' días · '+'★'.repeat(st)+'. Premio '+fmt(bonus)+'.');
  banner('Nivel '+S.level+' superado · '+'★'.repeat(st)+'☆'.repeat(3-st),'+'+fmt(bonus)+(S.level<LEVELS.length?' · Siguiente: '+LEVELS[S.level].name+' ('+DIFF_L[S.level]+')':' · ¡Has completado todos los niveles!'));
  S.level++;S.lvStart=S.day;S.lvBase=JSON.parse(JSON.stringify(S.stats));
  if(S.level>LEVELS.length)log('Has completado los 10 niveles. Puedes seguir jugando en modo libre.');
  else log('Empieza el nivel '+S.level+': '+LEVELS[S.level-1].name+'. La competencia aprieta: clientes más exigentes, material más caro y más imprevistos.');
  renderAll();
}
function banner(t,m){const el=document.createElement('div');el.className='banner';el.innerHTML=`<img src="${BEE_SRC}" alt=""><div><b>${esc(t)}</b><span>${esc(m)}</span></div>`;$('.mapwrap').appendChild(el);setTimeout(()=>el.remove(),6500);}
function renderGoals(){
  const el=$('#goalsbox');
  if(S.level>LEVELS.length){el.innerHTML=`<div class="gh"><b>Modo libre</b><span>${S.stars.reduce((a,b)=>a+b,0)} ★ en 10 niveles</span></div>`;return;}
  const L=lvl(),left=Math.ceil(S.lvStart+L.days-S.day);
  el.innerHTML=`<div class="gh"><b>Nivel ${S.level} · ${L.name}</b><span>${DIFF_L[S.level-1]}</span></div>`+
   L.goals.map(g=>{const v=goalVal(g),ok=v>=g.v;return `<div class="gl ${ok?'ok':''}"><div class="gt"><span>${ok?'✓ ':''}${g.l}</span><em>${goalTxt(g,v)}</em></div><div class="gb"><i style="width:${clamp(v/g.v,0,1)*100}%"></i></div></div>`;}).join('')+
   `<div class="gf">${left>=0?'★★★ si lo logras en '+days(left):left>=-L.days*0.5?'★★ si lo logras en '+days(left+L.days*0.5):'Aún puedes conseguir ★'}</div>`;
}
function endGame(why){
  S.over=true;S.speed=0;

  $('#overlay').innerHTML=`<div class="card"><img class="bee" src="${BEE_SRC}" alt=""><h2>Te has quedado sin caja</h2><p>La caja ha bajado de 0 € en el nivel ${Math.min(S.level,10)}. Revisa márgenes, gastos fijos y el ritmo de contrataciones.</p>
   <div class="stats"><div><span>Nivel alcanzado</span><b>${Math.min(S.level,10)} · ${S.stars.reduce((a,b)=>a+b,0)} ★</b></div><div><span>Días jugados</span><b>${Math.floor(S.day)+1}</b></div>
   <div><span>Instalado</span><b>${kw(S.stats.kwp)}</b></div><div><span>Bombas de calor</span><b>${S.stats.aero}</b></div>
   <div><span>Facturación firmada</span><b>${fk(S.stats.sales)}</b></div><div><span>Obras cobradas</span><b>${S.stats.closed}</b></div></div>
   <button class="btn pri" data-act="new">Empezar de nuevo desde el nivel 1</button></div>`;
  renderAll();

const cv=$('#map'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;const cam={x:0,y:0,z:1,tx:null,ty:null,init:false};
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=Math.max(1,Math.round(W*DPR));cv.height=Math.max(1,Math.round(H*DPR));}
new ResizeObserver(()=>{resize();if(!cam.init)fitMap();}).observe(cv);
const TW=64,TH=32;

  else if(S.tab==='material'){
    h+=`<div class="grp"><span>Cómo compras el material</span><span></span></div>
      <div class="item"><div class="t"><b>${S.nave?'Nave propia en Tres Cantos':'Directo del distribuidor'}</b><small>${S.nave?'Material un 8 % más barato que la tarifa, pero pagas '+fmt(COST.nave)+'/mes y compras stock por adelantado. Lo que no haya en la nave se pide solo al distribuidor para esa obra.':'Cada obra se compra al firmar y el distribuidor la lleva a obra (+12 % sobre tarifa). Sin almacén ni stock parado.'}</small></div>
      <button class="btn sm ${S.nave?'':'dark'}" data-act="nave">${S.nave?'Cerrar nave':'Alquilar nave · '+fmt(COST.naveSetup)}</button></div>`;
    if(S.nave){
      const waiting=S.jobs.filter(j=>j.stage==='material'&&!j.matFrom);
      h+=`<div class="grp"><span>Stock en la nave</span><span>precio nave</span></div>`+ITEMS.map(it=>`<div class="item"><div class="t"><b>${it.name}</b><small>${fmt(basePrice(it.k)*BUY.nave)}/ud · llega en ${it.lead} días${pendingFor(it.k)?' · '+pendingFor(it.k)+' en camino':''}</small></div><span class="qty">${S.stock[it.k]}</span><span class="btns" style="margin:0">${it.packs.map(q=>`<button class="btn sm" data-act="order" data-k="${it.k}" data-q="${q}">+${q}</button>`).join('')}</span></div>`).join('');
      if(waiting.length)h+=`<div class="note act">${waiting.length} obra${waiting.length>1?'s':''} esperando material.</div><div class="btns"><button class="btn dark" data-act="orderall">Pedir lo que falta</button></div>`;
    }
    h+=`<div class="grp"><span>Tarifa de referencia</span><span>nave / distribuidor</span></div><div class="calc">${ITEMS.map(it=>`<span>${it.name}</span><b>${fmt(basePrice(it.k)*BUY.nave)} / ${fmt(basePrice(it.k)*BUY.dist)}</b>`).join('')}</div>`;
  }
  else h+=S.log.map(l=>`<div class="log"><span>Día ${l.d}</span><div>${esc(l.t)}</div></div>`).join('');
  el.innerHTML=h;
  const am=$('#am');if(am)am.addEventListener('input',()=>{S.office.autoMargin=am.value/100;$('#amv').textContent=am.value+' %';});
}
let dirty=true;function renderAll(){dirty=true;}
function flush(){if(!dirty)return;dirty=false;renderTop();if(!sliderActive)renderDetail();if(!(document.activeElement&&document.activeElement.id==='am'))renderTabs();}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,j=S.sel&&job(S.sel);
  switch(a){
    case 'speed':if(!S.over&&S.started)S.speed=+b.dataset.v;break;
    case 'new':$('#overlay').hidden=true;newGame();S.started=true;S.speed=1;cam.init=false;fitMap();break;
    case 'start':$('#overlay').hidden=true;S.started=true;S.speed=1;break;
    case 'tab':S.tab=b.dataset.t;break;
    case 'qvisit':case 'qsend':case 'qnave':case 'qdist':case 'qcrew':{const q=job(+b.dataset.id);if(!q)break;S.sel=q.id;quick(q,a);break;}
    case 'qall':S.jobs.filter(needsAct).forEach(q=>quick(q,'auto'));break;
    case 'rec':if(j){applyRec(j);sliderActive=false;}break;
    case 'autop':S.autoPause=!S.autoPause;break;
    case 'sel':S.sel=+b.dataset.id;{const s=slotOf(job(S.sel));focus(s.x,s.y);}break;
    case 'visit':if(j)sendVisit(j,S.com.find(c=>c.id===b.dataset.c));break;
    case 'opt':if(j){j.opt=+b.dataset.i;sliderActive=false;}break;
    case 'send':if(j){sliderActive=false;sendProposal(j);}break;
    case 'orderjob':if(j)orderMissing([j]);break;
    case 'distjob':if(j)buyDist(j);break;
    case 'orderall':orderMissing(S.jobs.filter(x=>x.stage==='material'&&!x.matFrom));break;
    case 'order':order(b.dataset.k,+b.dataset.q);break;
    case 'own':if(j)assignPart(j,b.dataset.p,true);break;
    case 'sub':if(j)assignPart(j,b.dataset.p,false);break;
    case 'hire':hire(b.dataset.k,b.dataset.id);break;
    case 'promote':promote(b.dataset.id);break;
    case 'disc':if(j){j.disc=!j.disc;sliderActive=false;}break;
    case 'hireteam':hire(b.dataset.k);break;
    case 'fire':fire(b.dataset.k,b.dataset.id);break;
    case 'zone':{const c=S.capt.find(x=>x.id===b.dataset.id);const L=T_TOWNS;c.town=L[(L.findIndex(t=>t.i===c.town)+1)%L.length].i;break;}
    case 'mkt':S.mkt[b.dataset.k]=!S.mkt[b.dataset.k];log((S.mkt[b.dataset.k]?'Activas ':'Paras ')+CHANNELS[b.dataset.k].name+'.');break;
    case 'feria':feria();break;
    case 'dir':S.office[b.dataset.k]=!S.office[b.dataset.k];log((S.office[b.dataset.k]?'Contratas ':'Prescindes de ')+(b.dataset.k==='dirCom'?'dirección comercial (Nando)':'dirección de operaciones (Rubén)')+'.');if(S.office.dirOps)S.jobs.filter(x=>x.stage==='obra').forEach(autoCrew);break;
    case 'legal':S.office.legal=b.dataset.v;break;
    case 'admin':S.office.admin=b.dataset.v;break;
    case 'nave':if(S.nave){S.nave=false;const v=ITEMS.reduce((a,it)=>a+S.stock[it.k]*basePrice(it.k)*0.75,0);S.cash+=v;S.stock=emptyStock();log('Cierras la nave y liquidas el stock por '+fmt(v)+'.');S.jobs.filter(x=>x.stage==='material'&&!x.matFrom).forEach(buyDist);}else{S.nave=true;S.cash-=COST.naveSetup;log('Alquilas una nave en Tres Cantos (entrada '+fmt(COST.naveSetup)+').');toast('Nave alquilada','Pide stock en la pestaña Material.','lime');}break;
    case 'zin':zoomAt(1.2,W/2,H/2);break;
    case 'zout':zoomAt(1/1.2,W/2,H/2);break;
    case 'center':focus(base.x,base.y);break;
  }
  renderAll();
});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||!S.started||S.over)return;if(e.code==='Space'){e.preventDefault();S.speed=S.speed?0:1;renderAll();}});

let last=performance.now(),uiT=0;
function loop(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  updCars(dt);
  if(S.speed&&!S.over){const dd=dt*S.speed/DAY_SEC;S.day+=dd;updVans(dd);tickJobs(dd);
    const na=S.jobs.filter(needsAct).length;if(S.autoPause&&na>S.lastAct){S.speed=0;toast('En pausa','Hay algo nuevo que decidir. Dale a 1× cuando acabes.','lime');renderAll();}S.lastAct=na;
    if(Math.floor(S.day)>S.lastDay){S.lastDay=Math.floor(S.day);onNewDay();}
    if(S.cash<BANK_LIMIT&&!S.over){endGame('bank');}
    uiT+=dt;if(uiT>0.5){uiT=0;checkLevel();renderAll();}}
  if(cam.tx!==null){cam.x+=(cam.tx-cam.x)*0.12;cam.y+=(cam.ty-cam.y)*0.12;if(Math.abs(cam.tx-cam.x)+Math.abs(cam.ty-cam.y)<0.5)cam.tx=null;}
  if(W)draw(now);flush();requestAnimationFrame(loop);
}
newGame();
$('#overlay').innerHTML=`<div class="card"><img class="bee" src="${BEE_SRC}" alt=""><h2>Haz crecer Zero Wattios</h2>
  <p>Empiezas con 100.000 € y un equipo pequeño en Tres Cantos. Supera 10 niveles sin parar la partida: cada nivel tiene sus objetivos y, al superarlo, empieza el siguiente con más dificultad.</p>
  <ul><li><b>Objetivos</b> arriba a la izquierda del mapa. Si los cumples a tiempo ganas ★★★ y un premio en caja.</li>
  <li><b>Cada nivel aprieta más:</b> clientes más exigentes con el precio, material más caro, leads que se enfrían antes y más imprevistos.</li>
  <li><b>Tareas pendientes</b> en la pestaña Obras, con botones de un clic. Las abejas del mapa marcan lo que toca decidir.</li>
  <li>Si la caja baja de 0 €, pierdes y vuelves al nivel 1.</li></ul>
  <button class="btn pri" data-act="start" style="width:100%;padding:12px">Empezar en el nivel 1</button></div>`;
resize();fitMap();requestAnimationFrame(loop);
})();
</script>

</body>
